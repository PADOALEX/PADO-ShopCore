name: .NET 10 CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopcore_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopcore_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ShopAPI.slnx
      - name: Build
        run: dotnet build ShopAPI.slnx --no-restore -c Release
      - name: Unit tests
        run: dotnet test ShopAPI.UnitTests/ShopAPI.UnitTests.csproj --no-build -c Release --logger trx
      - name: PostgreSQL integration tests
        env:
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=shopcore_ci
        run: dotnet test ShopAPI.IntegrationTests/ShopAPI.IntegrationTests.csproj --no-build -c Release --logger trx
      - name: Publish API
        run: dotnet publish ShopAPI.Web/ShopAPI.Web.csproj --no-restore -c Release -o ./publish
      - name: Build Docker image
        run: docker build --pull -t pado-shopcore:ci .
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
